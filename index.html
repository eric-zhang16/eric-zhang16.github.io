<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eric Zhang — Presentations</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --fg: #e8e8e8;
    --accent: #7aa2f7;
    --muted: #9aa3b2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2rem;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2.5rem;
  }
  ul.deck-list {
    list-style: none;
    padding: 0;
    margin: 0;
    width: 100%;
    max-width: 480px;
  }
  ul.deck-list li {
    margin-bottom: 0.75rem;
  }
  ul.deck-list a {
    display: block;
    padding: 1rem 1.25rem;
    background: #1a1d24;
    border: 1px solid #2a2e37;
    border-radius: 10px;
    color: var(--fg);
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  ul.deck-list a:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  ul.deck-list a .title {
    font-weight: 600;
  }
  ul.deck-list a .desc {
    display: block;
    font-size: 0.875rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
</style>
</head>
<body>
  <h1>Presentations</h1>
  <p class="subtitle">eric-zhang16</p>
  <ul class="deck-list">
    <li>
      <a href="trialdesignbench/">
        <span class="title">TrialDesignBench</span>
        <span class="desc">Benchmarking AI agents on clinical trial statistical design</span>
      </a>
    </li>
  </ul>
</body>
</html>
